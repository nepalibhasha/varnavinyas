[[not_samasa]]
word = "विकास"
notes = "Academy identifies वि prefix; not वि को कास."

[[not_samasa]]
word = "यातायात"
notes = "No reviewed pair/type; POS alone cannot establish याता + आयात as कर्मधारय."

[[not_samasa]]
word = "व्यवस्थापन"
notes = "Mechanical वि + अवस्थापन is not reviewed samasa evidence."

[[not_samasa]]
