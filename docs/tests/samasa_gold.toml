# Source-reviewed interpretations; a negative means no supported samasa analysis,
# not a spelling error or proof that the word has no historical derivation.

[[samasa]]
word = "सूर्योदय"
left = "सूर्य"
right = "उदय"
expected_type = "Tatpurusha"
vigraha = "सूर्य को उदय"

[[samasa]]
word = "महोत्सव"
left = "महा"
right = "उत्सव"
expected_type = "Karmadharaya"
vigraha = "महा उत्सव"
notes = "Brihat/Pragya define महोत्सव as a large उत्सव and महा as large; मह is not the reviewed member."

[[samasa]]
word = "एकचक्र"
left = "एक"
right = "चक्र"
expected_type = "Dvigu"
vigraha = "एक वटा चक्र"
notes = "Pragya's एउटा चक्र reading; not a claim about every adjectival or proper-name reading."

[[samasa]]
word = "पूर्वाधार"
left = "पूर्व"
right = "आधार"
expected_type = "Karmadharaya"
vigraha = "पहिलेको आवश्यक आधार"
notes = "Dictionary's पहिलेको sense of पूर्व modifies आधार; do not fabricate पूर्व को आधार."

[[samasa]]
word = "मापदण्ड"
left = "माप"
right = "दण्ड"
expected_type = "Tatpurusha"
vigraha = "मापन गर्ने साधन"
notes = "Pragya explicitly supplies [माप+दण्ड] and its meaning."

[[not_samasa]]
word = "सवारीमा"
notes = "सवारी + मा; lexical coincidence सवा + रीमा."

[[not_samasa]]
word = "दशकमा"
notes = "दशक + मा; कमा means comma, not a compound member here."

[[not_samasa]]
word = "आयात"
notes = "Reject आ + the unchanged surface."

[[not_samasa]]
