name: Release CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: varnavinyas
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: varnavinyas
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: varnavinyas
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: varnavinyas.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Derive CLI version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "cli_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "cli_version=${GITHUB_REF_NAME#cli-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --package varnavinyas

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Evaluate shared diagnostics
        run: node release/test-cli.mjs target/${{ matrix.target }}/release/${{ matrix.bin_name }}

      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.cli_version }}"
          TARGET="${{ matrix.target }}"
          STAGING="varnavinyas-cli-${VERSION}-${TARGET}"
          mkdir -p "dist/${STAGING}"
          cp "target/${TARGET}/release/${{ matrix.bin_name }}" "dist/${STAGING}/"
          cp LICENSE-APACHE LICENSE-MIT README.md docs/CLI_JSON_CONTRACT.md "dist/${STAGING}/"
          node release/package-metadata.mjs cli "$VERSION" "dist/${STAGING}" "$TARGET"
          (cd dist && tar -czf "${STAGING}.tar.gz" "${STAGING}")
          shasum -a 256 "dist/${STAGING}.tar.gz" > "dist/${STAGING}.tar.gz.sha256"

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.cli_version }}"
          $Target = "${{ matrix.target }}"
          $Staging = "varnavinyas-cli-$Version-$Target"
          New-Item -ItemType Directory -Force -Path "dist/$Staging" | Out-Null
          Copy-Item "target/$Target/release/${{ matrix.bin_name }}" "dist/$Staging/"
          Copy-Item LICENSE-APACHE,LICENSE-MIT,README.md,docs/CLI_JSON_CONTRACT.md "dist/$Staging/"
          node release/package-metadata.mjs cli "$Version" "dist/$Staging" "$Target"
          Compress-Archive -Path "dist/$Staging" -DestinationPath "dist/$Staging.zip" -Force
          $Hash = (Get-FileHash -Algorithm SHA256 "dist/$Staging.zip").Hash.ToLowerInvariant()
          "$Hash  $Staging.zip" | Out-File -Encoding ascii "dist/$Staging.zip.sha256"

      - name: Upload CLI asset
        uses: actions/upload-artifact@v4
        with:
          name: varnavinyas-cli-${{ steps.version.outputs.cli_version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish CLI release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Derive CLI version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "cli_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "release_tag=cli-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "cli_version=${GITHUB_REF_NAME#cli-}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CLI assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: CLI ${{ steps.version.outputs.cli_version }}
          draft: true
          generate_release_notes: true
          body_path: docs/releases/native-v0.1.2.md
          files: release-assets/*
