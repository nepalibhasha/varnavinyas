name: Release Python Artifact

on:
  push:
    tags:
      - "python-artifact-v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build and Release Python Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2

      - name: Derive artifact version
        id: version
        run: echo "artifact_version=${GITHUB_REF_NAME#python-artifact-}" >> "$GITHUB_OUTPUT"

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out ../../dist
          manylinux: auto
          target: x86_64
          working-directory: crates/bindings-python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test installed release wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          PYTHON=python bash crates/bindings-python/smoke-test.sh

      - name: Upload wheel to workflow
        uses: actions/upload-artifact@v4
        with:
          name: varnavinyas-python-${{ steps.version.outputs.artifact_version }}
          path: dist/*.whl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package evaluation metadata
        run: |
          STAGING="dist/varnavinyas-python-artifact-${{ steps.version.outputs.artifact_version }}"
          mkdir -p "$STAGING"
          cp dist/*.whl "$STAGING/"
          node release/package-metadata.mjs python "${{ steps.version.outputs.artifact_version }}" "$STAGING" x86_64-linux
          (cd dist && zip -qr "varnavinyas-python-artifact-${{ steps.version.outputs.artifact_version }}.zip" "varnavinyas-python-artifact-${{ steps.version.outputs.artifact_version }}")
          (cd dist && shasum -a 256 *.whl *.zip > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Python Artifact ${{ steps.version.outputs.artifact_version }}
          draft: true
          generate_release_notes: true
          body_path: docs/releases/native-v0.1.1.md
          files: |
            dist/*.whl
            dist/*.zip
            dist/SHA256SUMS
