name: Release iOS Artifact

on:
  push:
    tags:
      - "ios-artifact-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release iOS Artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Derive artifact version
        id: version
        run: echo "artifact_version=${GITHUB_REF_NAME#ios-artifact-}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and evaluate ios package
        run: bash release/build-ios.sh "${{ steps.version.outputs.artifact_version }}"

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: varnavinyas-ios-artifact-${{ steps.version.outputs.artifact_version }}
          path: |
            dist/varnavinyas-ios-artifact-*.zip
            dist/varnavinyas-ios-artifact-*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: iOS Artifact ${{ steps.version.outputs.artifact_version }}
          draft: true
          generate_release_notes: true
          body_path: docs/releases/native-v0.1.2.md
          files: |
            dist/varnavinyas-ios-artifact-*.zip
            dist/varnavinyas-ios-artifact-*.sha256
