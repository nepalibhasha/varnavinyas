name: Release Android Artifact

on:
  push:
    tags:
      - "android-artifact-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Android Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Derive artifact version
        id: version
        run: echo "artifact_version=${GITHUB_REF_NAME#android-artifact-}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and evaluate android package
        run: bash release/build-android.sh "${{ steps.version.outputs.artifact_version }}"

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: varnavinyas-android-artifact-${{ steps.version.outputs.artifact_version }}
          path: |
            dist/varnavinyas-android-artifact-*.zip
            dist/varnavinyas-android-artifact-*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android Artifact ${{ steps.version.outputs.artifact_version }}
          draft: true
          generate_release_notes: true
          body_path: docs/releases/native-v0.1.1.md
          files: |
            dist/varnavinyas-android-artifact-*.zip
            dist/varnavinyas-android-artifact-*.sha256
