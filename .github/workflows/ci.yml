name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo bench --workspace --no-run

  eval:
    name: Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p varnavinyas-eval --tests -- --nocapture

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  web_artifacts:
    name: Web Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install lockfile-matched wasm-bindgen-cli
        run: |
          WASM_BINDGEN_VERSION="$(
            awk '
              $0 == "name = \"wasm-bindgen\"" {
                getline
                if ($1 == "version" && $2 == "=") {
                  gsub(/"/, "", $3)
                  print $3
                  exit
                }
              }
            ' Cargo.lock
          )"
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Rebuild web and browser artifact
        run: |
          bash web/build.sh
          REFRESH_WEB_WASM=0 bash web/package-artifact.sh
      - name: Verify generated web artifacts
        run: |
          test -s web/build-info.json
          test -s web/pkg/varnavinyas_bindings_wasm.js
          test -s web/pkg/varnavinyas_bindings_wasm_bg.wasm
          git diff --exit-code -- .
